<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Skóre">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<title>Skóre</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--mut:#8e8e93;--line:#2c2c2e;--acc:#6b2cf5;--live:#ff453a;
  --num:'Barlow Condensed','Arial Narrow',-apple-system,sans-serif;
  --wide:'Archivo',-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{padding:calc(env(safe-area-inset-top) + 38px) 16px 6px}
header.d{padding:calc(env(safe-area-inset-top) + 30px) 12px 7px}
.tabs{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border-radius:12px;padding:7px 15px;font-family:var(--num);font-weight:700;font-size:19px;letter-spacing:.5px;line-height:1.2}
.pill.on{background:#fff;color:#000}
.pill.star{padding:7px 12px;display:flex;align-items:center}
.pill.star svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.pill.star.on svg{fill:currentColor}
.fstar{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.fstar svg{width:26px;height:26px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linejoin:round}
.fstar.on svg{fill:#ffd60a;stroke:#ffd60a}
.fstar:active{opacity:.6}
.card .top{display:flex;justify-content:space-between}
.card .top .lgt{font-family:var(--num);font-weight:700;letter-spacing:.5px;font-size:13px}
.back{font-size:46px;line-height:1;height:50px;padding:0 18px 8px 8px}
main{padding:6px 16px 0}
header.d + main{padding-top:0}
.strip{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.dy{flex:none;width:52px;background:var(--card);border-radius:12px;padding:5px 0;font-family:var(--num);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.15;color:var(--mut)}
.dy small{font-family:-apple-system,sans-serif;font-size:10.5px;font-weight:600}
.dy.on{background:var(--acc);color:#fff}
/* karty zápasů */
.card{background:var(--card);border-radius:20px;padding:13px 16px 8px;margin-bottom:10px;cursor:pointer}
.card .top{color:var(--mut);font-size:13.5px;margin-bottom:2px}
.card .top .live{color:var(--live);font-weight:600}
.row{display:flex;align-items:center;gap:11px;padding:6px 0}
.row img,.row .ph{width:24px;height:24px;object-fit:contain;flex:none}
.row .nm{font-family:var(--num);font-weight:700;font-size:19px;line-height:1.1}
.row .rec{color:var(--mut);font-size:13px;margin-left:6px;font-weight:400;font-family:-apple-system,sans-serif}
.row .sc{margin-left:auto;font-family:var(--num);font-weight:700;font-size:22px;min-width:50px;text-align:right}
.row.lose .nm,.row.lose .sc{color:var(--mut)}
.row .arr{width:10px;font-size:10px}
.msg{color:var(--mut);text-align:center;padding:36px 0;font-size:15px}
.msg button{margin-top:12px;background:var(--card);padding:9px 16px;border-radius:12px;color:#fff}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:20px;padding-bottom:30px}
/* detail zápasu */
.hero{background:var(--card);border-radius:22px;padding:16px 0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;margin:0 4px}
.hero .t{display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:600;font-size:14.5px}
.hero .t img,.hero .t .ph{width:42px;height:42px;object-fit:contain}
.hero .s{font-family:var(--num);font-weight:700;font-size:50px;line-height:1}
.hero .s.lose{color:var(--mut)}
.hero .m{text-align:center;font-size:14.5px;font-weight:500;line-height:1.35}
.hero .m.live{color:var(--live)}
.hero .m span{color:#fff}
.dtabs{display:flex;gap:21px;border-bottom:1px solid #3a3a3c;margin:4px -16px 0;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:none;padding:12px 0 13px;font-weight:600;font-size:16px;letter-spacing:1px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtabs button.on{color:#fff;border-color:#fff}
.dtabs.sm{gap:18px}
.dtabs.sm button{font-size:13px;letter-spacing:.6px}
.pane{background:var(--card);margin:0 -16px;padding:30px 16px 48px;min-height:70vh}
.pane.t{padding-top:10px}
.seg{display:flex;background:transparent;border-radius:999px;padding:3px;margin:0 auto;max-width:252px;border:1.5px solid #3a3a3c}
.seg button{flex:1;padding:3px 4px;border-radius:999px;font-weight:600;font-size:14px;color:#fff}
.seg button.on{background:#fff;color:#000}
.blk{margin-top:24px}
.seg + .blk{margin-top:8px}
.pv{margin-bottom:6px}
.pv .sec{margin:22px 0 8px;font-size:15px}
.lhd{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-family:var(--num);font-weight:700;font-size:19px;letter-spacing:.5px}
.lhd img{width:26px;height:26px;object-fit:contain}
.lc{padding:10px 0;border-top:1px solid #2c2c2e}
.lh{font-family:var(--wide);font-stretch:112%;font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);text-align:center;margin-bottom:8px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ld{display:flex;gap:10px;align-items:flex-start;min-width:0}
.ld .lt{padding-top:2px}
.ln small.pl{margin:0 4px 0 0}
.ld.r{flex-direction:row-reverse;text-align:right}
.ld .hs{width:52px;height:52px;border-radius:50%;background:#2c2c2e;object-fit:cover;flex:none}
.ld .lt{min-width:0}
.ln{font-family:var(--num);font-weight:700;font-size:17px;line-height:1.1}
.ln small{color:var(--mut);font-family:-apple-system,sans-serif;font-size:10px;font-weight:600;margin-left:4px}
.lv{font-family:var(--num);font-weight:700;font-size:21px;line-height:1.15}
.ls{color:var(--mut);font-size:11.5px;line-height:1.25}
.ld .ls{white-space:nowrap;font-size:10.5px;letter-spacing:-.1px}
.ld[data-player]{cursor:pointer}
.hero .t .rc{font-size:12px;font-weight:500;color:var(--mut)}
.lhd .rc{font-family:-apple-system,sans-serif;font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0}
.tt th.hd{text-align:left;vertical-align:middle}
.tt th.hd .sec{margin:0}
.cc{padding:10px 0 6px;border-top:1px solid #2c2c2e}
.ct{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:6px}
.cr{display:flex;align-items:center;gap:10px;margin:5px 0}
.cr img,.cr .ph{width:26px;height:26px;object-fit:contain;flex:none}
.cv{width:50px;font-family:var(--num);font-weight:700;font-size:19px;flex:none}
.bar{flex:1;height:10px;border-radius:6px;background:#2f3a47;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.cx{width:42px;text-align:right;font-size:13px;color:var(--mut);font-weight:600;flex:none}
.ir{cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #2c2c2e}
.ir .hs{width:44px;height:44px;border-radius:50%;background:#2c2c2e;object-fit:cover;flex:none}
.is{text-align:right;flex:none}
.tt{width:100%;border-collapse:collapse;white-space:normal}
.tt th{padding:10px 6px;text-align:right;border-bottom:1px solid #3a3a3c}
.tt th img{width:26px;height:26px;object-fit:contain}
.tt td{padding:12px 6px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.tt td:first-child{text-align:left;color:#d1d1d6;padding-left:0}
.tt td.mut{color:var(--mut);width:48px;font-size:13px}
.tt tbody tr:nth-child(odd) td{background:#242426}
.tt th:first-child{width:56%}
.chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1px solid #a85a3a;color:#ff9f5a}
.chip.red{border-color:#c0443c;color:#ff6b61}
.l5{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #2c2c2e}
.l5c:first-child{border-right:1px solid #2c2c2e;padding-right:10px}
.l5c:last-child{padding-left:10px}
.l5r{display:flex;align-items:center;gap:8px;padding:11px 0;cursor:pointer;border-bottom:1px solid #2c2c2e}
.l5r:last-child{border-bottom:0}
.l5r:active{opacity:.6}
.l5r .rw{width:16px;font-weight:800;font-family:var(--num);font-size:18px}
.l5r .ro{width:56px;font-family:var(--num);font-weight:700;font-size:16px;white-space:nowrap}
.l5r img,.l5r .ph{width:24px;height:24px;object-fit:contain;flex:none}
.l5r .rs2{margin-left:auto;font-family:var(--num);font-size:17px;white-space:nowrap}
.l5r .rs2 b{font-weight:700}.l5r .rs2 i{font-style:normal;color:var(--mut)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th{color:#fff;font-weight:700;font-size:11px;text-align:center;padding:12px 5.6px 14px;border-bottom:1px solid #3a3a3c}
th.n{text-align:left;font-family:var(--wide);font-stretch:112%;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding-left:0;position:sticky;left:0;background:var(--card)}
td{text-align:center;padding:4.8px 5.6px;font-size:15px}
th.n,td.n{width:100%}
th:last-child,td:last-child{padding-right:1px}
tbody tr:first-child td{padding-top:11px}
td.n{text-align:left;padding-left:0;position:sticky;left:0;background:var(--card);font-family:var(--num);font-weight:700;font-size:16.5px;line-height:1.1}
.pn{display:inline-block;max-width:118px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
td.n small{color:var(--mut);font-family:-apple-system,sans-serif;font-size:10px;font-weight:600;margin-left:4px}
.neg{position:absolute;margin-left:-.45em}
tr[data-player]{cursor:pointer}
tr[data-player]:active td{opacity:.6}
.res{text-align:left;white-space:nowrap;padding:4.8px 10px 4.8px 4px}
.wl{display:inline-block;width:21px;font-weight:700}
.scr{display:inline-block;min-width:34px;font-variant-numeric:normal}
.sfx{display:inline-block;width:20px;font-size:11px;color:var(--mut);font-weight:600}
.W{color:#34c759;font-weight:700}.L{color:#ff453a;font-weight:700}
details{border-bottom:1px solid #3a3a3c}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-family:var(--wide);font-stretch:112%;font-weight:800;font-size:12px;letter-spacing:.5px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:'⌄';font-size:18px;font-weight:400}
details[open] summary::after{content:'⌃'}
.play{display:flex;gap:12px;align-items:center;padding:8px 0}
.play .pl{width:26px;flex:none}
.play .pl img{width:24px;height:24px;object-fit:contain}
.play .clk{width:42px;flex:none;color:var(--mut);font-size:13.5px}
.play .txt{flex:1;font-size:13.5px;line-height:1.3}
.play.scr .txt{font-weight:700}
.play .sco{display:block;color:var(--mut);font-size:12px;margin-top:2px;font-weight:600}
.play.g{align-items:flex-start;padding:11px 0}
.play.g .txt{font-weight:500}
.play.g .sco{color:#fff;font-weight:700;font-size:12.5px;margin-top:4px}
/* hráč */
.phero{display:flex;align-items:center;gap:14px;margin:4px 4px 14px}
.phero .hs{width:68px;height:68px;border-radius:50%;background:var(--card);object-fit:cover;flex:none}
.pname{font-family:var(--num);font-weight:700;font-size:28px;line-height:1.05}
.psub{color:var(--mut);font-size:13px;margin-top:3px}
.grow{flex:1}
.icon{width:38px;height:38px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center}
.icon svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.sinp{flex:1;min-width:0;height:40px;background:var(--card);border:0;border-radius:12px;padding:0 14px;color:#fff;font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.sinp::placeholder{color:var(--mut)}
.sinp::-webkit-search-cancel-button{-webkit-appearance:none}
.sec{font-family:var(--wide);font-stretch:112%;font-weight:800;font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin:24px 4px 4px}
.res-row{display:flex;align-items:center;gap:13px;padding:9px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.res-row:active{opacity:.6}
.res-row img{width:34px;height:34px;object-fit:contain;flex:none}
.res-row img.hs{border-radius:50%;background:#2c2c2e;object-fit:cover}
.res-row .rn{font-family:var(--num);font-weight:700;font-size:21px;line-height:1.1}
.res-row .rs{color:var(--mut);font-size:13px}
.phero .tl{width:64px;height:64px;object-fit:contain;flex:none}
.hero .t{cursor:pointer}
.jn{display:inline-block;width:24px;color:var(--mut);font-family:-apple-system,sans-serif;font-size:11px;font-weight:600}
.pane > .blk:first-child{margin-top:6px}
.sch th.n,.sch td.n{width:auto;min-width:92px}
.sch .opp{width:100%;text-align:left;white-space:nowrap}
.sch .opp small{color:var(--mut);font-size:11px;font-weight:600;display:inline-block;width:18px}
.sch .opp img{width:22px;height:22px;vertical-align:middle;margin:0 7px 0 2px;object-fit:contain}
.sch .opp b{font-family:var(--num);font-size:17px}
.sch .rs{text-align:right;white-space:nowrap;padding-right:1px}
.sch tr[data-game]{cursor:pointer}
.stt{white-space:normal}
.fx{table-layout:fixed}
.fx th,.fx td{padding-left:1px;padding-right:1px;overflow:visible}
.fx th{font-size:11px}
.fx td{font-size:15px}
.fx td.sm{font-size:12.5px}
.sep tbody td{border-bottom:1px solid #2c2c2e}
.fx tr.xp{cursor:pointer}
.fx tr.sub td{color:var(--mut);font-size:13px}
.fx tr.sub td.n{font-family:-apple-system,sans-serif;font-weight:600;font-size:12px}
.chev{display:inline-block;width:7px;height:7px;border:solid var(--mut);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:7px;vertical-align:3px}
.chev.up{transform:rotate(-135deg);vertical-align:-2px}
.sep tbody tr:last-child td{border-bottom:0}
.fx tbody td,.fx tbody tr:first-child td{padding-top:4.8px;padding-bottom:4.8px}
.fx tbody tr:first-child td{padding-top:8px}
.fx th[data-sort]{cursor:pointer;position:relative}
.fx th.on::after{content:'';position:absolute;left:50%;bottom:5px;margin-left:-3px;border:3px solid transparent;border-top:4px solid #fff}
.fx th.on.asc::after{border-top-color:transparent;border-bottom:4px solid #fff;bottom:7px}
.fx th.n,.fx td.n{width:auto;padding-left:0;position:static}
.fx .pn{max-width:100%}
.fx td.n{overflow:hidden;text-overflow:ellipsis}
.stt td.n{min-width:0}
.mu{color:var(--mut)}
.per{border-bottom:1px solid #3a3a3c;padding-bottom:6px}
.per:last-child{border-bottom:0}
.phd{font-family:var(--wide);font-stretch:112%;font-weight:800;font-size:12px;letter-spacing:.5px;padding:16px 0 4px}
.pname.up{text-transform:uppercase}
.phero .tl{width:72px;height:72px}
.ros th,.ros td{padding-left:4.5px;padding-right:4.5px}
.ros th.n,.ros td.n{padding-left:0}
.ros .pn{max-width:calc(100vw - 244px)}
.ros th:not(.n),.ros td:not(.n){font-size:14.5px}
.ros th:not(.n){font-size:11px}
.mstrip{position:relative;display:flex;gap:4px;overflow-x:auto;margin:0 -16px;padding:0 16px 12px;scrollbar-width:none;border-bottom:1px solid #3a3a3c;-webkit-overflow-scrolling:touch}
.mstrip::-webkit-scrollbar{display:none}
.mo{flex:none;min-width:66px;padding:6px 10px;border-radius:12px;color:var(--mut);font-weight:600;font-size:13px;line-height:1.25;display:flex;flex-direction:column;align-items:center}
.mo.on{background:var(--acc);color:#fff}
.mstrip + .blk{margin-top:10px}
.sch .rs b{font-weight:600;font-family:var(--num);font-size:19px}
.sch .rs .W,.sch .rs .L{font-family:var(--num);font-size:19px;display:inline-block;width:18px;text-align:left;margin-right:4px}
.sch .rs .ar{display:inline-block;width:16px;text-align:center;font-style:normal;font-size:9px;vertical-align:middle}
.sch .rs .s1{display:inline-block;width:22px;text-align:right}
.sch .rs .s2{display:inline-block;width:22px;text-align:left}
.sch .rs .mu{color:var(--mut)}
.sch .rs .sf{display:inline-block;width:24px;text-align:left;color:var(--mut);font-size:10px;margin-left:3px;font-weight:600}
.sch .rs .live{color:var(--live);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>

<script>
const API = 'https://site.api.espn.com/apis/site/v2/sports/';
const WEB = 'https://site.web.api.espn.com/apis/common/v3/sports/';
const LEAGUES = {
  nfl: { name: 'NFL', path: 'football/nfl' },
  nba: { name: 'NBA', path: 'basketball/nba' },
  nhl: { name: 'NHL', path: 'hockey/nhl' }
};
const NFL_GROUPS = { passing:'Passing', rushing:'Rushing', receiving:'Receiving', fumbles:'Fumbles', defensive:'Defensive',
  interceptions:'Interceptions', kickReturns:'Kick Returns', puntReturns:'Punt Returns', kicking:'Kicking', punting:'Punting' };
// sloupce: [zobrazený název, možné názvy v datech]
const NHL_SKATER = [['G',['G']],['A',['A']],['+/-',['+/-']],['PIM',['PIM']],['S',['S','SOG']],['HIT',['HIT','HT']],['BKS',['BKS','BS']],['TOI',['TOI']]];
const NHL_GOALIE = [['SA',['SA']],['SV',['SV']],['GA',['GA']],['SV%',['SV%']],['TOI',['TOI']]];
const NBA_COLS = [['MIN',['MIN']],['PTS',['PTS']],['REB',['REB']],['AST',['AST']],['FG',['FG']],['3PT',['3PT']],['FT',['FT']],['STL',['STL']],['BLK',['BLK']],['TO',['TO']],['PF',['PF']],['+/-',['+/-']]];
const GL_COLS = { nba:['MIN','PTS','REB','AST','STL','BLK','FG','3PT','FT','TO'], nhl:['G','A','PTS','+/-','PIM','SOG','S','TOI'] };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DAYS = ['Ne','Po','Út','St','Čt','Pá','So'];
const fmtTime = iso => new Date(iso).toLocaleTimeString('cs-CZ', { hour:'2-digit', minute:'2-digit' });
const fmtShort = iso => { const d = new Date(iso); return d.getDate() + '.' + (d.getMonth()+1) + '.'; };
const dayWord = iso => ymd(new Date(iso)) === ymd(new Date()) ? 'Today' : fmtShort(iso);
const todayET = () => { const p = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).split('-').map(Number); return new Date(p[0], p[1]-1, p[2], 12); };
const FAVKEY = 'favs';
const getFavs = () => { try { return JSON.parse(localStorage.getItem(FAVKEY) || '[]'); } catch (e) { return []; } };
const isFav = (l, id) => getFavs().some(f => f.l === l && f.id === String(id));

/* ---------- normalizace ---------- */
function normTeam(c) {
  c = c || {};
  const t = c.team || {};
  let score = c.score;
  if (score && typeof score === 'object') score = score.displayValue;
  const rec = (c.records && c.records[0] && c.records[0].summary) ||
              (Array.isArray(c.record) && c.record[0] && c.record[0].displayValue) || '';
  return { id: t.id, abbr: t.abbreviation || '', name: t.shortDisplayName || t.displayName || t.name || '',
    logo: t.logo || (t.logos && t.logos[0] && t.logos[0].href) || '',
    score: score != null ? String(score) : '', winner: !!c.winner, record: rec };
}
function normEvent(ev) {
  const c = (ev.competitions && ev.competitions[0]) || {};
  const comps = c.competitors || [];
  const homeC = comps.find(x => x.homeAway === 'home') || comps[0];
  const awayC = comps.find(x => x.homeAway === 'away') || comps[1];
  const t = ((ev.status || c.status || {}).type) || {};
  const e = { id: ev.id, date: ev.date || c.date, state: t.state, short: t.shortDetail || t.detail || '',
              home: normTeam(homeC), away: normTeam(awayC) };
  if (e.state === 'post' && !e.home.winner && !e.away.winner) {
    const h = parseInt(e.home.score), a = parseInt(e.away.score);
    if (!isNaN(h) && !isNaN(a) && h !== a) (h > a ? e.home : e.away).winner = true;
  }
  return e;
}
function statusText(e) { return e.state === 'pre' ? fmtTime(e.date) : e.short; }

async function loadFavs(silent) {
  const my = ++reqId;
  const favs = getFavs();
  if (!silent) { state.loading = true; state.error = null; state.events = []; render(); }
  const res = await Promise.allSettled(favs.flatMap(f => { const b = API + LEAGUES[f.l].path + '/teams/' + f.id + '/schedule'; return [getJson(b), getJson(b + '?seasontype=3')].map(p => p.then(j => ({ f, j }))); }));
  if (my !== reqId) return;
  const byTeam = new Map();
  res.forEach(r => { if (r.status !== 'fulfilled') return; const { f, j } = r.value; const k = f.l + f.id; if (!byTeam.has(k)) byTeam.set(k, { f, evs: new Map() }); ((j && j.events) || []).forEach(ev => { if (ev && !byTeam.get(k).evs.has(ev.id)) { const e = normEvent(ev); e.league = f.l; byTeam.get(k).evs.set(ev.id, e); } }); });
  const out = new Map();
  byTeam.forEach(({ evs }) => {
    const all = [...evs.values()].sort((a, b) => new Date(a.date) - new Date(b.date));
    const past = all.filter(e => e.state === 'post').slice(-1), live = all.filter(e => e.state === 'in'), next = all.filter(e => e.state === 'pre').slice(0, 1);
    [...past, ...live, ...next].forEach(e => out.set(e.league + e.id, e));
  });
  state.events = [...out.values()].sort((a, b) => new Date(a.date) - new Date(b.date));
  state.error = favs.length && !res.some(r => r.status === 'fulfilled') ? 'Nepodařilo se načíst data.' : null;
  state.loading = false; state.favLoaded = true;
  if (topView() === 'list') render();
}
async function loadList(silent) {
  if (state.league === 'fav') return loadFavs(silent);
  const L = LEAGUES[state.league];
  const my = ++reqId;
  if (!silent) { state.loading = true; state.error = null; state.events = []; render(); }
  try {
    const j = await getJson(API + L.path + '/scoreboard?dates=' + ymd(state.date));
    if (my !== reqId) return;
    state.events = (j.events || []).map(normEvent);
    state.error = null;
  } catch (e) {
    if (my !== reqId) return;
    state.error = 'Nepodařilo se načíst data (' + (e.message || e) + ').';
  }

  if (topView() === 'list') render();
}
async function loadGame() {
  const g = state.game; if (!g) return;
  try {
    const sum = await getJson(API + LEAGUES[g.league].path + '/summary?event=' + g.id);
    const comp = sum.header && sum.header.competitions && sum.header.competitions[0];
    g.sum = sum;
    if (comp) g.ev = normEvent({ id: sum.header.id, date: comp.date, status: comp.status, competitions: [comp] });
    g.err = null;
    if (!g.tabInit) { g.tabInit = true; g.tab = g.ev && g.ev.state === 'pre' ? 'preview' : 'stats'; }
    else if (g.ev && g.ev.state !== 'pre' && g.tab === 'preview' && !g.tabSet) g.tab = 'stats';
    if (g.ev && !g.ts && !g.tsLoading) loadPreviewStats(g);

const teamsP = {};
function parseTeams(j) {
  const out = [];
  const add = tm => {
    if (tm && tm.id && !out.some(x => x.id === String(tm.id)))
      out.push({ id: String(tm.id), name: tm.displayName || '', abbr: tm.abbreviation || '', loc: tm.location || '', short: tm.shortDisplayName || tm.name || '', slug: tm.slug || '',
        logo: tm.logo || (tm.logos && tm.logos[0] && tm.logos[0].href) || '' });
  };
  (((j.sports || [])[0] || {}).leagues || []).forEach(l => (l.teams || []).forEach(t => add(t.team || t)));
  if (!out.length) (j.teams || []).forEach(t => add(t.team || t));
  if (!out.length) {
    const walk = n => { if (!n) return; ((n.standings && n.standings.entries) || n.entries || []).forEach(e => add(e.team)); (n.children || []).forEach(walk); };
    walk(j);
  }
  return out;
}
function ensureTeams(league) {
  if (state.teamList[league]) return Promise.resolve(state.teamList[league]);
  if (!teamsP[league]) {
    const path = LEAGUES[league].path;
    const urls = [API + path + '/teams', API + path + '/teams?limit=100',
      'https://site.web.api.espn.com/apis/site/v2/sports/' + path + '/teams',
      'https://site.api.espn.com/apis/v2/sports/' + path + '/standings',
      'https://site.web.api.espn.com/apis/v2/sports/' + path + '/standings'];
    teamsP[league] = (async () => {
      let lastErr = null;
      for (const u of urls) {
        try {
          const list = parseTeams(await getJson(u));
          if (list.length) {
            list.sort((a, b) => a.name.localeCompare(b.name));
            const m = {};
            list.forEach(x => { if (x.abbr) { m['id' + x.id] = x.abbr; if (x.slug) m[x.slug] = x.abbr; } });
            state.teamList[league] = list; state.teams[league] = m; state.teamErrs[league] = false;
            return list;
          }
          lastErr = new Error('prázdná odpověď');
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('chyba');
    })().catch(e => { delete teamsP[league]; throw e; });
  }
  return teamsP[league];
}
async function loadPlayer() {

async function loadTeam() {
  const t = state.team; if (!t) return;
  const base = API + LEAGUES[t.league].path + '/teams/' + t.id;
  const res = await Promise.allSettled([getJson(base), getJson(base + '/roster'), getJson(base + '/schedule'), getJson(base + '/statistics'),
    getJson(base + '/schedule?seasontype=1'), getJson(base + '/schedule?seasontype=3'), ensureTeams(t.league)]);
  const val = r => r.status === 'fulfilled' ? r.value : null;
  const er = r => r.status === 'rejected' ? String((r.reason && r.reason.message) || r.reason) : null;

  if (fav && !state.favScrolled && state.events.length) { const f = document.querySelector('[data-first]'); if (f) { state.favScrolled = true; window.scrollTo(0, Math.max(0, f.getBoundingClientRect().top + window.scrollY - 190)); } }

function cardHTML(e) {

}

/* ----- tabulka statistik ----- */
function teamNameOf(ti) {
  const g = state.game, ts = g && g.sum && g.sum.boxscore && g.sum.boxscore.players;
  return (ts && ts[ti] && ts[ti].team && ts[ti].team.displayName) || '';

function tbl(title, labels, rows) {
  const trs = rows.map(r => `<tr data-player="${esc(r.id)}" data-pn="${esc(r.name)}" data-pp="${esc(r.pos)}" data-pj="${esc(r.jersey)}" data-pl="${esc(state.game ? state.game.league : '')}" data-pt="${esc(teamNameOf(r.ti))}">
    <td class="n"><span class="pn">${esc(r.short)}</span><small>${esc(r.pos)}</small></td>${r.vals.map(v => `<td>${nv(v)}</td>`).join('')}</tr>`).join('');
  return `<section class="blk"><div class="tw"><table><thead><tr><th class="n">${esc(title)}</th>${labels.map(l => `<th>${esc(l)}</th>`).join('')}</tr></thead><tbody>${trs}</tbody></table></div></section>`;
}
function mergedAthletes(t) {
  const map = new Map();
  (t.statistics || []).forEach(grp => {
    const labels = grp.labels || grp.names || grp.keys || [];
    (grp.athletes || []).forEach(a => {
      if (!a.athlete) return;
      const id = a.athlete.id;
      let m = map.get(id);
      if (!m) { m = { a: a.athlete, starter: !!a.starter, vals: {}, has: false }; map.set(id, m); }
      if (a.starter) m.starter = true;
      if (a.stats && a.stats.length) {
        m.has = true;
        labels.forEach((l, i) => { if (m.vals[l] === undefined) m.vals[l] = a.stats[i]; });
      }
    });
  });
  return [...map.values()].filter(m => m.has);
}
function pickCols(list, cfg) {
  let cols = cfg.map(c => ({ label: c[0], key: c[1].find(k => list.some(m => m.vals[k] !== undefined)) })).filter(c => c.key);
  if (cols.length < 2 && list.length) cols = Object.keys(list[0].vals).map(k => ({ label: k, key: k }));
  return cols;
}
function toRows(list, cols, ti) {
  return list.map(m => ({ id: m.a.id, name: m.a.displayName || m.a.shortName || '', short: m.a.shortName || m.a.displayName || '',
    pos: (m.a.position && m.a.position.abbreviation) || '', jersey: m.a.jersey || '', ti,
    vals: cols.map(c => m.vals[c.key] !== undefined ? m.vals[c.key] : '-') }));
}
function statsHTML(g) {
  const teams = (g.sum.boxscore && g.sum.boxscore.players) || [];
  if (!teams.length) return msg('Statistiky zatím nejsou k dispozici.');
  const idx = Math.min(g.team, teams.length - 1);
  const seg = `<div class="seg">${teams.map((t, i) =>
    `<button data-team="${i}" class="${i === idx ? 'on' : ''}">${esc((t.team && (t.team.shortDisplayName || t.team.displayName)) || 'Tým ' + (i+1))}</button>`).join('')}</div>`;
  const t = teams[idx];
  let out = '';
  if (g.league === 'nhl') {
    const all = mergedAthletes(t);
    const posOf = m => (m.a.position && m.a.position.abbreviation) || '';
    const sets = [['Forwards', all.filter(m => !['D', 'G'].includes(posOf(m))), NHL_SKATER],
                  ['D-Men', all.filter(m => posOf(m) === 'D'), NHL_SKATER],
                  ['Goalies', all.filter(m => posOf(m) === 'G'), NHL_GOALIE]];
    sets.forEach(s => { if (s[1].length) { const cols = pickCols(s[1], s[2]); out += tbl(s[0], cols.map(c => c.label), toRows(s[1], cols, idx)); } });
  } else if (g.league === 'nba') {
    const all = mergedAthletes(t);
    const sets = [['Starters', all.filter(m => m.starter)], ['Bench', all.filter(m => !m.starter)]];
    sets.forEach(s => { if (s[1].length) { const cols = pickCols(s[1], NBA_COLS); out += tbl(s[0], cols.map(c => c.label), toRows(s[1], cols, idx)); } });
  } else {
    (t.statistics || []).forEach(grp => {
      const labels = grp.labels || grp.names || [];
      const ath = (grp.athletes || []).filter(a => a.athlete && a.stats && a.stats.length);
      if (!ath.length) return;
      const rows = ath.map(a => ({ id: a.athlete.id, name: a.athlete.displayName || '', short: a.athlete.shortName || a.athlete.displayName || '',
        pos: (a.athlete.position && a.athlete.position.abbreviation) || '', jersey: a.athlete.jersey || '', ti: idx, vals: a.stats }));
      out += tbl(NFL_GROUPS[grp.name] || grp.text || grp.name || '', labels, rows);
    });
  }
  return seg + (out || msg('Statistiky zatím nejsou k dispozici.'));
}

  g.tsLoading = true;

    const sel = (t.sort && t.sort[gk]) || {};
    const defK = cols.find(k => ['PTS', 'YDS', 'W'].includes(c.labels[k])) ?? cols[Math.min(1, cols.length - 1)];
    const sk = sel.k != null && cols.includes(sel.k) ? sel.k : defK, asc = !!sel.asc;
    const num = v => { const x = String(v).replace(/,/g, ''); if (/^\d+:\d+$/.test(x)) { const m = x.split(':'); return +m[0] * 60 + +m[1]; } const n = parseFloat(x); return isNaN(n) ? -1e9 : n; };
    const rows = [...c.rows].sort((x, y) => (asc ? 1 : -1) * (num(x.vals[sk]) - num(y.vals[sk])));
    const trs = rows.map(r => {
      const a = r.a, pos = (a.position && a.position.abbreviation) || '';
      return `<tr data-player="${esc(a.id)}" data-pl="${t.league}" data-pn="${esc(a.displayName || '')}" data-pp="${esc(pos)}" data-pj="${esc(a.jersey || '')}" data-pt="${esc(tn)}"><td class="n"><span class="pn" style="max-width:none">${esc(shortNm(a.displayName || a.fullName))}</span><small>${esc(pos)}</small></td>${cols.map(k => `${cell(r.vals[k])}`).join('')}</tr>`;
    }).join('');
    return `<section class="blk"><div class="tw"><table class="fx sep"><colgroup><col style="width:124px"></colgroup><thead><tr><th class="n">${esc(CAT_NAME[String(title).toLowerCase()] || title)}</th>${cols.map(k => `<th data-sort="${k}" data-sg="${esc(gk)}" class="${k === sk ? 'on' + (asc ? ' asc' : '') : ''}">${esc(dl(c.labels[k], t.league))}</th>`).join('')}</tr></thead><tbody>${trs}</tbody></table></div></section>`;
  }).join('');
}

/* ---------- hledání ---------- */
const SEARCH_SVG = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
let sTimer = null;
async function searchPlayers(q, league) {
  const parts = LEAGUES[league].path.split('/'), qq = encodeURIComponent(q);
  const H = 'https://site.web.api.espn.com/apis/';
  const urls = [
    H + 'common/v3/search?query=' + qq + '&limit=20&mode=prefix&type=player&sport=' + parts[0] + '&league=' + parts[1],
    H + 'common/v3/search?query=' + qq + '&limit=20&type=player&sport=' + parts[0] + '&league=' + parts[1],
    H + 'search/v2?query=' + qq + '&limit=20&type=player',
    H + 'common/v3/search?query=' + qq + '&limit=20&type=player'
  ];
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (toks.length > 1) {
    [toks[toks.length - 1], toks[0]].forEach(w => {
      urls.push(H + 'common/v3/search?query=' + encodeURIComponent(w) + '&limit=50&type=player&sport=' + parts[0] + '&league=' + parts[1]);
      urls.push(H + 'search/v2?query=' + encodeURIComponent(w) + '&limit=50&type=player');
    });
  }
  const settled = await Promise.allSettled(urls.map(getJson));
  const seen = new Set(), out = [];
  let ok = false, lastErr = null;
  settled.forEach(r => {
    if (r.status !== 'fulfilled') { lastErr = r.reason; return; }
    ok = true;
    const j = r.value;
    const raw = j.items || (j.results || []).flatMap(x => (x.contents || x.items || []).map(c => Object.assign({ type: x.type }, c)));
    raw.forEach(i => {
      if (i.type && i.type !== 'player') return;
      const uid = String(i.uid || '');
      const lg = i.league || i.defaultLeagueSlug || '';
      if (lg && lg !== parts[1]) return;
      if (!lg && (i.sport && i.sport !== parts[0])) return;
      const id = (uid.match(/a:(\d+)/) || [])[1] || (/^\d+$/.test(String(i.id || '')) ? String(i.id) : '');
      const name = i.displayName || i.name || i.fullName;
      if (!id || !name || seen.has(id)) return;
      const words = name.toLowerCase().split(/[\s.\-]+/);
      if (!toks.every(k => words.some(w => w.startsWith(k)))) return;
      seen.add(id);
      out.push({ id, name, sub: (typeof i.subtitle === 'string' && i.subtitle) || (typeof i.description === 'string' ? i.description : '') || (i.isActive === false ? 'Retired' : '') });
    });
  });
  if (!ok && lastErr) throw lastErr;
  return out;
}
const curLeague = () => LEAGUES[state.league] ? state.league : 'nhl';
const leagueOrder = () => [curLeague(), ...Object.keys(LEAGUES).filter(k => k !== curLeague())];
function runPlayerSearch() {
  clearTimeout(sTimer);
  const q = state.sq.trim();
  if (q.length < 2) { state.sp = null; paintSearch(); return; }
  const my = state.sp = { q, loading: true, items: [], errs: [] };
  paintSearch();
  sTimer = setTimeout(async () => {
    const order = leagueOrder();
    const res = await Promise.allSettled(order.map(l => searchPlayers(q, l)));
    res.forEach((r, i) => {
      if (r.status === 'fulfilled') r.value.slice(0, 10).forEach(x => my.items.push(Object.assign({}, x, { league: order[i] })));
      else my.errs.push(order[i]);
    });
    my.loading = false;
    if (state.sp === my) paintSearch();
  }, 350);
}
function paintSearch() {
  const res = document.getElementById('sres'); if (!res) return;
  const q = state.sq.trim().toLowerCase(), toks = q.split(/\s+/).filter(Boolean), order = leagueOrder();
  let loaded = 0, failed = 0;
  const rows = [];
  order.forEach(l => {
    const list = state.teamList[l];
    if (!list) { if (state.teamErrs[l]) failed++; return; }
    loaded++;
    let t = list;
    if (toks.length) t = list.filter(x => {
      const words = [x.name, x.abbr, x.loc, x.short].join(' ').toLowerCase().split(/[\s.\-]+/);
      return toks.every(k => words.some(w => w.startsWith(k)));
    });
    else if (l !== curLeague()) t = [];
    t.forEach(x => rows.push(`<div class="res-row" data-topen="${esc(x.id)}" data-tl="${l}" data-tn="${esc(x.name)}" data-tlogo="${esc(x.logo)}">${logoImg(x.logo)}<div class="grow"><div class="rn">${esc(x.name)}</div><div class="rs">${l.toUpperCase()}</div></div><button class="fstar ${isFav(l, x.id) ? 'on' : ''}" data-fav="${esc(x.id)}" data-fl="${l}" data-fn="${esc(x.name)}" data-flogo="${esc(x.logo)}" aria-label="Oblíbený tým">${STAR_SVG}</button></div>`));
  });
  let html = '';
  if (rows.length) html += '<div class="sec">Týmy</div>' + rows.join('');
  if (!loaded) html += failed ? msg('Týmy se nepodařilo načíst (' + state.teamErrText + ').') : msg('Načítám…');
  if (q.length >= 2) {
    html += '<div class="sec">Hráči</div>';
    const sp = state.sp;
    if (!sp || sp.loading) html += msg('Hledám…');
    else if (!sp.items.length) html += msg(sp.errs.length >= order.length ? 'Hledání hráčů se nepodařilo.' : 'Žádní hráči.');
    else html += sp.items.map(i => {
      const sub = i.league.toUpperCase() + (i.sub ? ' · ' + i.sub : '');
      return `<div class="res-row" data-player="${esc(i.id)}" data-pl="${i.league}" data-pn="${esc(i.name)}" data-pp="" data-pj="" data-pt="${esc(i.sub)}">
      <img class="hs" src="https://a.espncdn.com/i/headshots/${i.league}/players/full/${esc(i.id)}.png" alt="" onerror="this.style.visibility='hidden'"><div><div class="rn">${esc(i.name)}</div><div class="rs">${esc(sub)}</div></div></div>`;
    }).join('');
  }
  res.innerHTML = html;
}
function renderSearch() {
  if (!document.getElementById('sq')) {
    $app.innerHTML = `<header class="d"><div class="tabs"><button class="back" data-back aria-label="Zpět">‹</button><input id="sq" class="sinp" type="search" placeholder="Hledat tým nebo hráče" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" value="${esc(state.sq)}"></div></header><main><div id="sres"></div></main>`;
    if (!state.sq) { const el = document.getElementById('sq'); setTimeout(() => el && el.focus(), 80); }
  }
  paintSearch();
  Object.keys(LEAGUES).forEach(l => {
    if (!state.teamList[l]) ensureTeams(l).then(paintSearch, e => { state.teamErrs[l] = true; state.teamErrText = String((e && e.message) || e); paintSearch(); });
  });
}

/* ---------- navigace ---------- */
function openGame(league, id) {
  if (state.league !== 'fav') state.league = league;
  state.game = { league, id, sum: null, ev: null, tab: 'stats', team: 0, pvTeam: 0, err: null, tabInit: false };
  state.open.clear(); state.closed.clear();
  render(); loadGame();
}
function openTeam(league, id) {
  if (state.team && state.team.id === id && state.team.league === league) { render(); return; }
  state.team = { league, id, tab: 'roster', done: false, pre: (state.tmeta && state.tmeta.id === id) ? state.tmeta : null };
  render(); loadTeam();
}
function playerNav(d) {
  state.pmeta = { league: d.pl, id: d.player, name: d.pn || '', pos: d.pp || '', jersey: d.pj || '', team: d.pt || '', tab: 'gl', loaded: false, done: false };
  window._fromList = true;
  location.hash = '#/player/' + d.pl + '/' + d.player;
}
function route() {
  const h = location.hash;
  let m = h.match(/^#\/player\/(\w+)\/(\d+)/);
  if (m && LEAGUES[m[1]]) {
    if (!state.player || state.player.id !== m[2]) {
      state.player = (state.pmeta && state.pmeta.id === m[2]) ? state.pmeta
        : { league: m[1], id: m[2], name: '', pos: '', jersey: '', team: '', tab: 'gl', loaded: false, done: false };
    }
    render();
    if (!state.player.loaded) loadPlayer();
    return;
  }
  state.player = null;
  m = h.match(/^#\/game\/(\w+)\/(\d+)/);
  if (m && LEAGUES[m[1]]) { if (state.game && state.game.id === m[2]) render(); else openGame(m[1], m[2]); return; }
  state.game = null;
  m = h.match(/^#\/team\/(\w+)\/(\d+)/);
  if (m && LEAGUES[m[1]]) { openTeam(m[1], m[2]); return; }
  state.team = null;
  if (h.startsWith('#/search')) { state.search = true; render(); return; }
  state.search = false;
  render(); loadList(true);
}
window.addEventListener('hashchange', route);

const $app = document.getElementById('app');
$app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-league],[data-game],[data-date],[data-tab],[data-ptab],[data-xp],[data-ttab],[data-pvt],[data-sort],[data-fav],[data-team],[data-player],[data-topen],[data-search],[data-month],[data-refresh],[data-back]');
  if (!b) return;
  const d = b.dataset;
  if (d.fav !== undefined) {
    toggleFav({ l: d.fl, id: d.fav, name: d.fn || '', logo: d.flogo || '' });
    if (topView() === 'search') paintSearch(); else render();
  } else if (d.league) {
    state.league = d.league; if (d.league !== 'fav') store.set('league', d.league);
    state.favScrolled = false;
    setDate(todayET()); loadList();
  } else if (d.player) {
    playerNav(d);
  } else if (d.topen) {
    state.tmeta = { league: d.tl, id: d.topen, name: d.tn || '', logo: d.tlogo || '' };
    window._fromList = true; location.hash = '#/team/' + d.tl + '/' + d.topen;
  } else if (d.search !== undefined) {
    state.sleague = state.league; window._fromList = true; location.hash = '#/search';
  } else if (d.month) {
    state.team.month = d.month; render();
  } else if (d.game !== undefined) {
    window._fromList = true; location.hash = '#/game/' + (d.gl || state.league) + '/' + d.game;
  } else if (d.date) {
    setDate(new Date(+d.date.slice(0, 4), +d.date.slice(4, 6) - 1, +d.date.slice(6, 8), 12));
    loadList();
  } else if (d.tab) {
    state.game.tab = d.tab; state.game.tabSet = true; window.scrollTo(0, 0); render();
  } else if (d.xp !== undefined) {
    const e = state.player.exp = state.player.exp || new Set(); if (e.has(d.xp)) e.delete(d.xp); else e.add(d.xp); render();
  } else if (d.ptab) {
    state.player.tab = d.ptab; render();
  } else if (d.sort !== undefined) {
    const t = state.team; t.sort = t.sort || {}; const cur = t.sort[d.sg];
    t.sort[d.sg] = { k: +d.sort, asc: cur && cur.k === +d.sort ? !cur.asc : false }; render();
  } else if (d.pvt !== undefined) {
    state.game.pvTeam = +d.pvt; render();
  } else if (d.ttab) {
    state.team.tab = d.ttab; if (d.ttab === 'stats' && state.team.done) loadTeamPlayers(state.team); render();
  } else if (d.team !== undefined) {
    state.game.team = parseInt(d.team); render();
  } else if (d.refresh !== undefined) {
    const v = topView();
    if (v === 'player') { state.player.done = false; render(); loadPlayer(); } else if (v === 'game') loadGame(); else if (v === 'list') loadList();
  } else if (d.back !== undefined) {
    if (window._fromList && history.length > 1) history.back(); else location.hash = '';
  }
});
$app.addEventListener('input', ev => {
  if (ev.target.id === 'sq') { state.sq = ev.target.value; runPlayerSearch(); }
});
$app.addEventListener('toggle', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.period) return;
  const k = parseInt(el.dataset.period);
  if (el.open) { state.open.add(k); state.closed.delete(k); } else { state.closed.add(k); state.open.delete(k); }
}, true);

setInterval(() => {
  if (document.hidden) return;
  const v = topView();
  if (v === 'game') { if (state.game.ev && state.game.ev.state === 'in') loadGame(); }
  else if (v === 'list' && state.events.some(e => e.state === 'in')) loadList(true);
}, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const v = topView();
  if (v === 'game') loadGame(); else if (v === 'list') loadList(true);
});

if (/^#\/(game|team|search|player)/.test(location.hash)) route(); else loadList();
</script>
</body>
</html>
