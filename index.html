<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Scores</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--mut:#8e8e93;--line:#2c2c2e;--acc:#6b2cf5;--live:#ff453a;
  --num:'Barlow Condensed','Arial Narrow',-apple-system,sans-serif;
  --wide:'Archivo',-apple-system,sans-serif}
html.fsg{--num:'Space Grotesk',-apple-system,sans-serif;--wide:'Space Grotesk',-apple-system,sans-serif}
html.fsg *{font-family:'Space Grotesk',-apple-system,sans-serif!important;font-stretch:100%!important;font-size-adjust:.46}
html.fbar{--wide:'Barlow Condensed',-apple-system,sans-serif}
html.fbar *{font-family:'Barlow Condensed','Arial Narrow',-apple-system,sans-serif!important;font-stretch:100%!important;font-size-adjust:.595}
html.fbar body{font-weight:500}
/* alt fonts change only the letters: keep classic line boxes (classic uses the fonts' 'normal' ≈ 1.2), so cards, pills and switches keep their size */
html.fsg body,html.fbar body{line-height:1.2}
html.fbar .tnud{position:relative;top:-.055em}
.crt tbody td{vertical-align:baseline}

html.fbar .gl2 .glr b,html.fbar .sch .rs b,html.fbar .sch .sc2 b,html.fbar .sch .tm{font-weight:500}
/* ===== Design 2.0: black→purple gradient + glass cards ===== */
html.d2 body{background:transparent}
/* team / player pages: their colour fades down into black (no hard edge) */
html.d2.tbg{background:#000 !important}
html.d2.tbg body{background:transparent !important}
/* the page gradient is fixed to the viewport; the sticky header (also pinned to the viewport top) paints the very same gradient, so there is no seam */
html.d2.tbg body::before,html.d2.tbg .stkw{background:#000 linear-gradient(180deg,var(--pbg) 0,var(--pbg) 10vh,#000 75vh) no-repeat 0 0 / 100vw 100vh !important}
html.d2.tbg .stkw{-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
html.d2.tbg .stkw.fx0{border-top-color:transparent;box-shadow:none}
html.d2 body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:#000}
html.d2{--card:rgba(44,38,64,.5)}
html.d2 .pane{background:rgba(30,26,44,.72)}
html.d2 td.n,html.d2 th.n{background:transparent}
html.d2 .pane .tw td.n,html.d2 .pane .tw th.n{background:transparent;box-shadow:none}
/* Design 2.0: the name column scrolls with the rest of the table (no sticky / no cover) */
html.d2 td.n,html.d2 th.n{position:static !important}
html.d2 tr.zb > td{background:rgba(255,255,255,.055) !important}
html.d2 .pane .tw tr.zb > td.n{background:rgba(255,255,255,.055) !important}
html.d2 .gl2 tbody tr:nth-child(even) td{background:rgba(255,255,255,.055)}
html.d2 :is(.card,.pane,.hero,.pill,.dy,.qb button,header .back,header .home[data-home],.ybtn,.hpill,.icon,.favh,.cmpclr,.msg button):not([style*='position']){position:relative}
html.d2 :is(.card,.pane,.hero,.pill,.dy,.qb button,header .back,header .home[data-home],.ybtn,.hpill,.icon,.favh,.cmpclr,.msg button,.lpm,.artbox)::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 30%,rgba(255,255,255,.01) 60%,rgba(255,255,255,.06));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3}
html.d2 :is(.card,.hero){box-shadow:0 10px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.03)}
html.d2 .stkw{background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
html.d2 .stkw.fx0{border-top-color:transparent;box-shadow:none}
html.d2 :is(.hpill,.lpm,.ylist,#lptip){background:rgba(44,38,64,.55);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
html.d2 .artbox{background:rgba(30,26,44,.78);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
html.d2 .pill.on,html.d2 .seg button.on{background:#fff}
html.d2 .dy.on{background:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body,button,input,td,th{font-variant-numeric:tabular-nums lining-nums}
/* Barlow: cislice maji stejnou sirku, ale kerning zuzuje dvojici 11 -> vypnout u cisel */
td,th,.pill,.dy,.row .sc,.hero .s,.hero .m .dt1,.lv,.lvt,.cv,.ld .dash,.l5r .rs2,.l5r .ro,.sch,.ldr .lv2,.dsc b,.res-row,.lgt{font-kerning:none}
html,body{overflow-x:clip;max-width:100%;overscroll-behavior-x:none}
.pane{overflow-x:clip}
main,header{max-width:100vw}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;user-select:none}
html,body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px !important}
html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{padding:calc(env(safe-area-inset-top) + 38px) 16px 6px}
header.d{padding:calc(env(safe-area-inset-top) + 30px) 12px 7px}
.tabs{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border-radius:12px;padding:7px 15px;font-family:var(--num);font-weight:700;font-size:19px;letter-spacing:.5px;line-height:1.2}
.pill.on{background:#fff;color:#000}
.pill.star{padding:7px 12px;display:flex;align-items:center}
.pill.star svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.pill.star.on svg{fill:currentColor}
.pill.cmpb svg{fill:none !important;stroke-linecap:round}
.fstar{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.fstar svg{width:26px;height:26px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linejoin:round}
.fstar.on svg{fill:#ffd60a;stroke:#ffd60a}
.row .nm.fv{color:#ffd60a}
.row.lose .nm.fv{color:#a88a12}
.rcx{background:none;border:0;color:var(--mut);font-size:13px;font-weight:600;float:right;margin-top:-2px;font-family:inherit}
.qb{display:flex;gap:8px;margin:10px 0 0}
.qb button{flex:1;background:var(--card);border-radius:12px;padding:9px 0;font-weight:700;font-size:14px;color:#fff;border:0;font-family:inherit}
.fstar:active{opacity:.6}
.card .top{display:flex;justify-content:space-between}
.card .top .lgt{font-family:var(--num);font-weight:700;letter-spacing:.5px;font-size:13px}
.back{font-size:46px;line-height:1;height:50px;padding:0 18px 8px 8px}
.home{height:50px;padding:0 10px;display:flex;align-items:center;color:#fff;background:none;border:0}
header .tys{margin:0}
header .tys .ybtn{height:40px;border-radius:12px;background:var(--card);padding:0 12px;font-size:14.5px;white-space:nowrap;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.3)}
header .tys .ylist{left:auto;right:0;z-index:60;min-width:200px;max-height:60vh}
header .tys{position:relative;z-index:60}
header .back,header .home[data-home]{height:40px;min-width:48px;padding:0 13px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
header .home[data-home] svg{width:22px;height:22px}
header.d .tabs{gap:8px;padding-bottom:4px}
header .back:active,header .home:active{opacity:.6}
.home.spin svg{animation:spn .8s linear}
@keyframes spn{to{transform:rotate(360deg)}}
.gloss{margin:30px 0 10px;padding-top:14px;border-top:1px solid #2c2c2e}
.gloss h4{margin:0 0 10px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;font-weight:800}
.gloss .gg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12.5px;color:var(--mut);line-height:1.3}
.gloss b{color:#fff;font-weight:700}
main{padding:6px 16px 0}
header.d + main{padding-top:0}
.strip{display:flex;gap:6px;overflow-x:auto;margin:10px 0 -3px;padding:0 0 3px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.strip .snap{scroll-snap-align:start;scroll-snap-stop:always}
.strip::-webkit-scrollbar{display:none}
.dy{flex:none;width:calc((100vw - 56px) / 5);background:var(--card);border-radius:12px;padding:5px 0;font-family:var(--num);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;color:#fff;height:calc(10px + 25.5px * 1.15);overflow:hidden}
.dy > *{line-height:1.15}
.dy small{font-family:-apple-system,sans-serif;font-size:10.5px;font-weight:600}
.dy.on{background:#fff;color:#000}
/* karty zápasů */
.card{background:var(--card);border-radius:22px;padding:13px 16px 8px;margin-bottom:10px;cursor:pointer}
.card .top{color:var(--mut);font-size:13.5px;margin-bottom:2px}
.card .top .live{color:var(--live);font-weight:600}
.row{display:flex;align-items:center;gap:11px;padding:6px 0}
.row img,.row .ph{width:24px;height:24px;object-fit:contain;flex:none}
.row .nm{font-family:var(--num);font-weight:700;font-size:19px;line-height:1.1}
.row .rec{color:var(--mut);font-size:13px;margin-left:6px;font-weight:400;font-family:-apple-system,sans-serif}
.row .sc{margin-left:auto;font-family:var(--num);font-weight:700;font-size:22px;min-width:50px;text-align:right}
.row.lose .nm,.row.lose .sc{color:var(--mut)}
.row .arr{width:10px;font-size:10px}
.msg{color:var(--mut);text-align:center;padding:36px 0;font-size:15px}
.msg.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.5);padding:44px 0}
.msg.ld::before{content:'';width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:#fff;border-right-color:rgba(255,255,255,.45);animation:spn .75s linear infinite}
.msg.ld{animation:ldin .25s ease}
@keyframes ldin{from{opacity:0}to{opacity:1}}
.msg button{margin-top:12px;background:var(--card);padding:9px 16px;border-radius:12px;color:#fff}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:20px;padding-bottom:30px}
/* detail zápasu */
.hero{background:var(--card);border-radius:22px;padding:16px 0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;margin:0 4px}
.hero.hw{padding-top:10px}
.hero .s{position:relative;white-space:nowrap}
.hero .s.ab{font-size:38px;cursor:pointer}
.hero .s.ab4{font-size:30px}
.hero .m .pd{text-transform:uppercase;font-family:var(--num);font-weight:700;font-size:19px;line-height:1.15;display:inline-block}
.hero .m .fin{font-family:var(--num);font-weight:700;font-size:19px;text-transform:uppercase;color:#fff}
.hero.hpre .t .rc{margin-top:2px}
.hero.hpre .m span{font-weight:600}
.hero .wa{position:absolute;top:50%;margin-top:-7px;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent}
.hero .wa.l{right:-14px;border-right:9px solid #fff}
.hero .wa.r{left:-14px;border-left:9px solid #fff}
.hero .wk{grid-column:1 / -1;font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.3px;margin-bottom:6px;text-align:center}
.hero .t{display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:600;font-size:14.5px}
.hero .t img,.hero .t .ph{width:42px;height:42px;object-fit:contain}
.hero .s{font-family:var(--num);font-weight:700;font-size:42px;line-height:1}
.hero .s.lose{color:var(--mut)}
.hero .m{text-align:center;font-size:14.5px;font-weight:500;line-height:1.35;position:relative;top:2px}
.hero .m.live{color:var(--live)}
.hero .m span{color:#fff}
.hero .m.pre{grid-column:2 / span 3}
.hero .m .dt1{font-family:var(--num);font-weight:700;font-size:22px;letter-spacing:.3px;white-space:nowrap}
.dtabs{display:flex;gap:21px;border-bottom:1px solid #3a3a3c;margin:4px -16px 0;padding:0 20px;overflow:hidden;touch-action:pan-y;overscroll-behavior:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:none;padding:12px 0 13px;font-weight:600;font-size:16px;letter-spacing:1px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtabs button.on{color:#fff;border-color:#fff}
.dtabs{border-bottom-color:rgba(255,255,255,.16)}
.dtabs button{color:rgba(255,255,255,.6)}
.dtabs button.on{color:#fff}
.dtabs.sm{gap:18px}
.dtabs.sm button{font-size:14.5px;letter-spacing:.3px}
.dtabs button{font-family:var(--wide);font-weight:800;font-stretch:105%}
.dtabs.five{gap:0;justify-content:space-between;padding:0 22px}
.dtabs.even{gap:0;justify-content:space-between;padding:0 26px}
.dtabs.five button{font-size:11.5px;letter-spacing:0;font-stretch:100%}
.pane{background:var(--card);margin:0 -16px 24px;padding:30px 16px 32px}
.pane.t{padding-top:10px}
.seg{display:flex;background:transparent;border-radius:999px;padding:3px;margin:0 auto;max-width:252px;border:1.5px solid #3a3a3c}
.seg button{flex:1;padding:3px 4px;border-radius:999px;font-weight:600;font-size:14px;color:#fff}
.seg button.on{background:#fff;color:#000}
.blk{margin-top:24px}
.seg + .blk{margin-top:8px}
.pv{margin-bottom:6px}
.pv .sec{margin:22px 0 8px;font-size:15px}
.pane > .pv:first-child .sec{margin-top:6px}
.pane.pvp{padding-top:14px}
.lhd{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-family:var(--num);font-weight:700;font-size:19px;letter-spacing:.5px}
.lhd img{width:26px;height:26px;object-fit:contain}
.lc{padding:10px 0;border-top:1px solid #2c2c2e}
.lh{font-family:var(--wide);font-stretch:112%;font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);text-align:center;margin-bottom:8px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ld{display:flex;gap:10px;align-items:flex-start;min-width:0}
.ld .lt{padding-top:2px}
.ln small.pl{margin:0 4px 0 0}
.ld.r{flex-direction:row-reverse;text-align:right}
.ld .hs{width:52px;height:52px;border-radius:50%;background:#2c2c2e;object-fit:cover;flex:none}
.ld .lt{min-width:0}
.ld .ln{white-space:nowrap}
.ld .ln.lg2{font-size:14px}
.ln{font-family:var(--num);font-weight:700;font-size:17px;line-height:1.1}
.ln small{color:var(--mut);font-family:-apple-system,sans-serif;font-size:10px;font-weight:600;margin-left:4px}
.lv{font-family:var(--num);font-weight:700;font-size:21px;line-height:1.15}
.ls{color:var(--mut);font-size:11.5px;line-height:1.25}
.ld .ls{white-space:nowrap;font-size:10.5px;letter-spacing:-.1px}
.ld[data-player]{cursor:pointer}
.hero .t .rc{white-space:nowrap;font-size:12px;font-weight:500;color:var(--mut)}
.lhd .rc{font-family:-apple-system,sans-serif;font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0}
.tt th.hd{text-align:left;vertical-align:middle}
.tt th.hd .sec{margin:0}
.cc{padding:10px 0 6px;border-top:1px solid #2c2c2e}
.ct{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:6px}
.cr{display:flex;align-items:center;gap:10px;margin:5px 0}
.cr img,.cr .ph{width:26px;height:26px;object-fit:contain;flex:none}
.cv{width:50px;font-family:var(--num);font-weight:700;font-size:19px;flex:none}
.bar{flex:1;height:10px;border-radius:6px;background:#2f3a47;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.cx{width:42px;text-align:right;font-size:13px;color:var(--mut);font-weight:600;flex:none}
.ir{cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #2c2c2e}
.ir .hs{width:44px;height:44px;border-radius:50%;background:#2c2c2e;object-fit:cover;flex:none}
.is{text-align:right;flex:none}
.tst td.n .pn{max-width:none}
.tst th img{width:24px;height:24px;object-fit:contain;vertical-align:middle}
.tst th:not(.n),.tst td:not(.n){min-width:58px;text-align:right}
.tst td.rk{color:var(--mut);font-size:13px;min-width:44px}
.ld.ldx{justify-content:center;align-items:center;min-height:56px}
.ld.ldx .dash{padding-top:0}
.ld .dash{font-family:var(--num);font-weight:700;font-size:21px;color:var(--mut);padding-top:16px}
.tt{width:100%;border-collapse:collapse;white-space:normal}
.tt th{padding:10px 6px;text-align:right;border-bottom:1px solid #3a3a3c}
.tt th img{width:26px;height:26px;object-fit:contain}
.tt td{padding:12px 6px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.tt td:first-child{text-align:left;color:#d1d1d6;padding-left:0}
.tt td.mut{color:var(--mut);width:48px;font-size:13px}
.tt tbody tr:nth-child(odd) td{background:#242426}
.tt th:first-child{width:56%}
.chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1px solid #a85a3a;color:#ff9f5a}
.chip.red{border-color:#c0443c;color:#ff6b61}
.l5{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #2c2c2e}
.l5c:first-child{border-right:1px solid #2c2c2e;padding-right:10px}
.l5c:last-child{padding-left:10px}
.l5r{display:flex;align-items:center;gap:8px;padding:11px 0;cursor:pointer;border-bottom:1px solid #2c2c2e}
.l5r:last-child{border-bottom:0}
.l5r:active{opacity:.6}
.l5r .rw{width:16px;font-weight:800;font-family:var(--num);font-size:18px}
.l5r .ro i{font-style:normal;width:17px;text-align:left}
.l5r .ro{width:49px;display:flex;align-items:center;gap:8px;font-family:var(--num);font-weight:700;font-size:16px;color:var(--mut);white-space:nowrap;flex:none}
.l5r img,.l5r .ph{width:24px;height:24px;object-fit:contain;flex:none}
.l5r .rs2{margin-left:auto;font-family:var(--num);font-size:17px;white-space:nowrap}
.l5r .rs2 u{text-decoration:none;margin:0 4px}
.l5r .rs2 b{font-weight:700}.l5r .rs2 i{font-style:normal;color:var(--mut)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:none;touch-action:pan-x pan-y}
#app{overflow-x:hidden;overflow-x:clip}
#app.lst{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
#app.lst > main{flex:none}
#app.lst > .hpw{margin-top:auto;padding-top:0}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th{color:#fff;font-weight:700;font-size:11px;text-align:center;padding:12px 5.6px 14px;border-bottom:1px solid #3a3a3c}
th.n{text-align:left;font-family:var(--wide);font-stretch:112%;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding-left:0;position:sticky;left:0;background:var(--card)}
td{text-align:center;padding:4.8px 5.6px;font-size:15px}

['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

document.addEventListener('scroll', e => { const t = e.target; if (t && t.nodeType === 1 && (t.id === 'app' || t.classList.contains('pane') || t.tagName === 'MAIN') && t.scrollLeft) t.scrollLeft = 0; }, { capture: true, passive: true });

document.addEventListener('error', e => { const im = e.target; if (im && im.tagName === 'IMG' && /\/500-dark\//.test(im.src) && !im.dataset.fb) { im.dataset.fb = 1; e.stopImmediatePropagation(); im.src = im.src.replace('/500-dark/', '/500/'); } }, true);
</script>
</body>
</html>
