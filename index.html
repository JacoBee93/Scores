<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Skóre">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<title>Skóre</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--mut:#8e8e93;--line:#2c2c2e;--acc:#6b2cf5;--live:#ff453a;
  --num:'Barlow Condensed','Arial Narrow',-apple-system,sans-serif;
  --wide:'Archivo',-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{padding:18px 16px 6px}
header.d{padding:4px 12px 0}
.tabs{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border-radius:12px;padding:7px 15px;font-family:var(--num);font-weight:700;font-size:19px;letter-spacing:.5px;line-height:1.2}
.pill.on{background:#fff;color:#000}
.back{font-size:32px;line-height:1;height:40px;padding:0 12px 4px 6px}
main{padding:6px 16px 0}
header.d + main{padding-top:0}
.strip{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.dy{flex:none;width:52px;background:var(--card);border-radius:12px;padding:5px 0;font-family:var(--num);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.15;color:var(--mut)}
.dy small{font-family:-apple-system,sans-serif;font-size:10.5px;font-weight:600}
.dy.on{background:var(--acc);color:#fff}
/* karty zápasů */
.card{background:var(--card);border-radius:20px;padding:13px 16px 8px;margin-bottom:10px;cursor:pointer}
.card .top{color:var(--mut);font-size:13.5px;margin-bottom:2px}
.card .top .live{color:var(--live);font-weight:600}
.row{display:flex;align-items:center;gap:11px;padding:6px 0}
.row img,.row .ph{width:24px;height:24px;object-fit:contain;flex:none}
.row .nm{font-family:var(--num);font-weight:700;font-size:19px;line-height:1.1}
.row .rec{color:var(--mut);font-size:13px;margin-left:6px;font-weight:400;font-family:-apple-system,sans-serif}
.row .sc{margin-left:auto;font-family:var(--num);font-weight:700;font-size:22px;min-width:50px;text-align:right}
.row.lose .nm,.row.lose .sc{color:var(--mut)}
.row .arr{width:10px;font-size:10px}
.msg{color:var(--mut);text-align:center;padding:36px 0;font-size:15px}
.msg button{margin-top:12px;background:var(--card);padding:9px 16px;border-radius:12px;color:#fff}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:20px;padding-bottom:30px}
/* detail zápasu */
.hero{background:var(--card);border-radius:20px;padding:13px 0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;margin:0 4px}
.hero .t{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13px}
.hero .t img,.hero .t .ph{width:34px;height:34px;object-fit:contain}
.hero .s{font-family:var(--num);font-weight:700;font-size:40px;line-height:1}
.hero .s.lose{color:var(--mut)}
.hero .m{text-align:center;font-size:13px;font-weight:500;line-height:1.35}
.hero .m.live{color:var(--live)}
.hero .m span{color:#fff}
.dtabs{display:flex;gap:21px;border-bottom:1px solid #3a3a3c;margin:4px -16px 0;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:none;padding:11px 0 9px;font-weight:600;font-size:14.5px;letter-spacing:1px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtabs button.on{color:#fff;border-color:#fff}
.dtabs.sm{gap:18px}
.dtabs.sm button{font-size:13px;letter-spacing:.6px}
.pane{background:var(--card);margin:0 -16px;padding:30px 16px 48px;min-height:70vh}
.pane.t{padding-top:10px}
.seg{display:flex;background:transparent;border-radius:999px;padding:3px;margin:0 auto;max-width:252px;border:1.5px solid #3a3a3c}
.seg button{flex:1;padding:5px 4px;border-radius:999px;font-weight:600;font-size:14px;color:#fff}
.seg button.on{background:#fff;color:#000}
.blk{margin-top:22px}
.seg + .blk{margin-top:27px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px;white-space:nowrap}
th{color:#fff;font-weight:700;font-size:11.5px;text-align:center;padding:12px 6px 14px;border-bottom:1px solid #3a3a3c}
th.n{text-align:left;font-family:var(--wide);font-stretch:112%;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding-left:0;position:sticky;left:0;background:var(--card)}
td{text-align:center;padding:4.5px 6px}
tbody tr:first-child td{padding-top:11px}
td.n{text-align:left;padding-left:0;position:sticky;left:0;background:var(--card);font-family:var(--num);font-weight:700;font-size:16.5px;line-height:1.1}
.pn{display:inline-block;max-width:118px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
td.n small{color:var(--mut);font-family:-apple-system,sans-serif;font-size:10px;font-weight:600;margin-left:4px}
.neg{position:absolute;margin-left:-.45em}
tr[data-player]{cursor:pointer}
tr[data-player]:active td{opacity:.6}
.W{color:#34c759;font-weight:700}.L{color:#ff453a;font-weight:700}
details{border-bottom:1px solid #3a3a3c}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-family:var(--wide);font-stretch:112%;font-weight:800;font-size:12px;letter-spacing:.5px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:'⌄';font-size:18px;font-weight:400}
details[open] summary::after{content:'⌃'}
.play{display:flex;gap:12px;align-items:center;padding:8px 0}
.play .pl{width:26px;flex:none}
.play .pl img{width:24px;height:24px;object-fit:contain}
.play .clk{width:42px;flex:none;color:var(--mut);font-size:13.5px}
.play .txt{flex:1;font-size:13.5px;line-height:1.3}
.play.scr .txt{font-weight:700}
.play .sco{display:block;color:var(--mut);font-size:12px;margin-top:2px;font-weight:600}
/* hráč */
.phero{display:flex;align-items:center;gap:14px;margin:4px 4px 14px}
.phero .hs{width:68px;height:68px;border-radius:50%;background:var(--card);object-fit:cover;flex:none}
.pname{font-family:var(--num);font-weight:700;font-size:28px;line-height:1.05}
.psub{color:var(--mut);font-size:13px;margin-top:3px}
</style>
</head>
<body>
<div id="app"></div>

<script>
const API = 'https://site.api.espn.com/apis/site/v2/sports/';
const WEB = 'https://site.web.api.espn.com/apis/common/v3/sports/';
const LEAGUES = {
  nfl: { name: 'NFL', path: 'football/nfl' },
  nba: { name: 'NBA', path: 'basketball/nba' },
  nhl: { name: 'NHL', path: 'hockey/nhl' }
};
const NFL_GROUPS = { passing:'Passing', rushing:'Rushing', receiving:'Receiving', fumbles:'Fumbles', defensive:'Defensive',
  interceptions:'Interceptions', kickReturns:'Kick Returns', puntReturns:'Punt Returns', kicking:'Kicking', punting:'Punting' };
// sloupce: [zobrazený název, možné názvy v datech]
const NHL_SKATER = [['G',['G']],['A',['A']],['+/-',['+/-']],['PIM',['PIM']],['S',['S','SOG']],['HIT',['HIT','HT']],['BKS',['BKS','BS']],['TOI',['TOI']]];
const NHL_GOALIE = [['SA',['SA']],['SV',['SV']],['GA',['GA']],['SV%',['SV%']],['TOI',['TOI']]];
const NBA_COLS = [['MIN',['MIN']],['PTS',['PTS']],['REB',['REB']],['AST',['AST']],['FG',['FG']],['3PT',['3PT']],['FT',['FT']],['STL',['STL']],['BLK',['BLK']],['TO',['TO']],['PF',['PF']],['+/-',['+/-']]];
const GL_COLS = { nba:['MIN','PTS','REB','AST','STL','BLK','FG','3PT','FT','TO'], nhl:['G','A','PTS','+/-','PIM','SOG','S','TOI'] };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DAYS = ['Ne','Po','Út','St','Čt','Pá','So'];
const fmtTime = iso => new Date(iso).toLocaleTimeString('cs-CZ', { hour:'2-digit', minute:'2-digit' });
const fmtShort = iso => { const d = new Date(iso); return d.getDate() + '.' + (d.getMonth()+1) + '.'; };
const dayWord = iso => ymd(new Date(iso)) === ymd(new Date()) ? 'Today' : fmtShort(iso);
const todayET = () => { const p = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).split('-').map(Number); return new Date(p[0], p[1]-1, p[2], 12); };
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const nv = v => /^-\d/.test(String(v)) ? `<span class="neg">-</span>${esc(String(v).slice(1))}` : esc(v);
const msg = t => `<div class="msg">${esc(t)}</div>`;
async function getJson(url) { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

const state = {
  league: LEAGUES[store.get('league')] ? store.get('league') : 'nba',
  date: todayET(), isToday: true, events: [], loading: false, error: null,
  game: null, player: null, pmeta: null, open: new Set(), closed: new Set()
};
function setDate(d) { state.date = d; state.isToday = ymd(d) === ymd(todayET()); }
let reqId = 0;
window._fromList = false;

/* ---------- normalizace ---------- */
function normTeam(c) {
  c = c || {};
  const t = c.team || {};
  let score = c.score;
  if (score && typeof score === 'object') score = score.displayValue;
  const rec = (c.records && c.records[0] && c.records[0].summary) ||
              (Array.isArray(c.record) && c.record[0] && c.record[0].displayValue) || '';
  return { id: t.id, abbr: t.abbreviation || '', name: t.shortDisplayName || t.displayName || t.name || '',
    logo: t.logo || (t.logos && t.logos[0] && t.logos[0].href) || '',
    score: score != null ? String(score) : '', winner: !!c.winner, record: rec };
}
function normEvent(ev) {
  const c = (ev.competitions && ev.competitions[0]) || {};
  const comps = c.competitors || [];
  const homeC = comps.find(x => x.homeAway === 'home') || comps[0];
  const awayC = comps.find(x => x.homeAway === 'away') || comps[1];
  const t = ((ev.status || c.status || {}).type) || {};
  const e = { id: ev.id, date: ev.date || c.date, state: t.state, short: t.shortDetail || t.detail || '',
              home: normTeam(homeC), away: normTeam(awayC) };
  if (e.state === 'post' && !e.home.winner && !e.away.winner) {
    const h = parseInt(e.home.score), a = parseInt(e.away.score);
    if (!isNaN(h) && !isNaN(a) && h !== a) (h > a ? e.home : e.away).winner = true;
  }
  return e;
}
function statusText(e) { return e.state === 'pre' ? fmtTime(e.date) : e.short; }

/* ---------- načítání ---------- */
async function loadList(silent) {
  const L = LEAGUES[state.league];
  const my = ++reqId;
  if (!silent) { state.loading = true; state.error = null; state.events = []; render(); }
  try {
    const j = await getJson(API + L.path + '/scoreboard?dates=' + ymd(state.date));
    if (my !== reqId) return;
    state.events = (j.events || []).map(normEvent);
    state.error = null;
  } catch (e) {
    if (my !== reqId) return;
    state.error = 'Nepodařilo se načíst data (' + (e.message || e) + ').';
  }
  state.loading = false;
  if (!state.game) render();
}
async function loadGame() {
  const g = state.game; if (!g) return;
  try {
    const sum = await getJson(API + LEAGUES[g.league].path + '/summary?event=' + g.id);
    const comp = sum.header && sum.header.competitions && sum.header.competitions[0];
    g.sum = sum;
    if (comp) g.ev = normEvent({ id: sum.header.id, date: comp.date, status: comp.status, competitions: [comp] });
    g.err = null;
  } catch (e) { g.err = 'Nepodařilo se načíst zápas (' + (e.message || e) + ').'; }
  if (state.game === g && !state.player) render();
}
async function loadPlayer() {
  const p = state.player; if (!p) return;
  p.loaded = true;
  const base = WEB + LEAGUES[p.league].path + '/athletes/' + p.id;
  const res = await Promise.allSettled([getJson(base + '/gamelog'), getJson(base + '/stats')]);
  const err = r => r.status === 'rejected' ? String((r.reason && r.reason.message) || r.reason) : null;
  p.gl = res[0].status === 'fulfilled' ? res[0].value : null; p.glErr = err(res[0]);
  p.st = res[1].status === 'fulfilled' ? res[1].value : null; p.stErr = err(res[1]);
  p.done = true;
  if (state.player === p) render();
}

/* ---------- vykreslení ---------- */
function render() {
  const y = window.scrollY;
  if (state.player) renderPlayer(); else if (state.game) renderGame(); else renderList();
  window.scrollTo(0, y);
}
const logoImg = src => src ? `<img src="${esc(src)}" alt="" onerror="this.style.visibility='hidden'">` : '<span class="ph"></span>';

function renderList() {
  const tabs = Object.entries(LEAGUES).map(([k, v]) =>
    `<button class="pill ${k === state.league ? 'on' : ''}" data-league="${k}">${v.name}</button>`).join('');
  let body;
  if (state.loading && !state.events.length) body = msg('Načítám…');
  else if (state.error && !state.events.length) body = `<div class="msg">${esc(state.error)}<br><button data-refresh>Zkusit znovu</button></div>`;
  else if (!state.events.length) body = msg('V tento den nejsou žádné zápasy.');
  else body = state.events.map(cardHTML).join('');
  let strip = '';
  for (let i = -30; i <= 30; i++) {
    const d = addDays(state.date, i);
    strip += `<button class="dy ${i === 0 ? 'on' : ''}" data-date="${ymd(d)}"><small>${DAYS[d.getDay()]}</small>${d.getDate()}.${d.getMonth()+1}.</button>`;
  }
  $app.innerHTML = `
    <header><div class="tabs">${tabs}</div>
    <div class="strip" id="strip">${strip}</div></header>
    <main>${body}<div class="foot">Data: ESPN (neoficiální API)</div></main>`;
  const s = document.getElementById('strip'), on = s && s.querySelector('.on');
  if (on) s.scrollLeft = on.offsetLeft - (s.clientWidth - on.offsetWidth) / 2;
}
function cardHTML(e) {
  const row = t => {
    const lose = e.state === 'post' && !t.winner;
    return `<div class="row ${lose ? 'lose' : ''}">${logoImg(t.logo)}<span class="nm">${esc(t.name)}${t.record ? `<span class="rec">(${esc(t.record)})</span>` : ''}</span>
      <span class="sc">${e.state === 'pre' ? '' : esc(t.score)}</span><span class="arr">${e.state === 'post' && t.winner ? '◀' : ''}</span></div>`;
  };
  return `<div class="card" data-game="${e.id}"><div class="top"><span class="${e.state === 'in' ? 'live' : ''}">${esc(statusText(e))}</span></div>${row(e.away)}${row(e.home)}</div>`;
}

function renderGame() {
  const g = state.game, e = g.ev;
  let body;
  if (g.err && !g.sum) body = `<div class="msg">${esc(g.err)}<br><button data-refresh>Zkusit znovu</button></div>`;
  else if (!g.sum) body = msg('Načítám…');
  else body = g.tab === 'stats' ? statsHTML(g) : playsHTML(g);
  const side = t => `<div class="t">${logoImg(t.logo)}<span>${esc(t.abbr)}</span></div>`;
  let hero = '';
  if (e) {
    const mid = e.state === 'post' ? `Final${e.short.replace('Final', '')}<br><span>${dayWord(e.date)}</span>`
              : e.state === 'pre' ? `${fmtTime(e.date)}<br><span>${dayWord(e.date)}</span>`
              : esc(e.short).replace(' - ', '<br>');
    hero = `<div class="hero">${side(e.away)}
      <span class="s ${e.state === 'post' && !e.away.winner ? 'lose' : ''}">${e.state === 'pre' ? '' : esc(e.away.score)}</span>
      <div class="m ${e.state === 'in' ? 'live' : ''}">${mid}</div>
      <span class="s ${e.state === 'post' && !e.home.winner ? 'lose' : ''}">${e.state === 'pre' ? '' : esc(e.home.score)}</span>
      ${side(e.home)}</div>`;
  }
  $app.innerHTML = `
    <header class="d"><div class="tabs"><button class="back" data-back aria-label="Zpět">‹</button></div></header>
    <main>${hero}
      <div class="dtabs"><button data-tab="stats" class="${g.tab === 'stats' ? 'on' : ''}">Stats</button><button data-tab="plays" class="${g.tab === 'plays' ? 'on' : ''}">Plays</button></div>
      <div class="pane ${g.tab === 'stats' ? '' : 't'}">${body}</div></main>`;
}

/* ----- tabulka statistik ----- */
function tbl(title, labels, rows) {
  const trs = rows.map(r => `<tr data-player="${esc(r.id)}" data-pn="${esc(r.name)}" data-pp="${esc(r.pos)}" data-pj="${esc(r.jersey)}" data-ti="${r.ti}">
    <td class="n"><span class="pn">${esc(r.short)}</span><small>${esc(r.pos)}</small></td>${r.vals.map(v => `<td>${nv(v)}</td>`).join('')}</tr>`).join('');
  return `<section class="blk"><div class="tw"><table><thead><tr><th class="n">${esc(title)}</th>${labels.map(l => `<th>${esc(l)}</th>`).join('')}</tr></thead><tbody>${trs}</tbody></table></div></section>`;
}
function mergedAthletes(t) {
  const map = new Map();
  (t.statistics || []).forEach(grp => {
    const labels = grp.labels || grp.names || grp.keys || [];
    (grp.athletes || []).forEach(a => {
      if (!a.athlete) return;
      const id = a.athlete.id;
      let m = map.get(id);
      if (!m) { m = { a: a.athlete, starter: !!a.starter, vals: {}, has: false }; map.set(id, m); }
      if (a.starter) m.starter = true;
      if (a.stats && a.stats.length) {
        m.has = true;
        labels.forEach((l, i) => { if (m.vals[l] === undefined) m.vals[l] = a.stats[i]; });
      }
    });
  });
  return [...map.values()].filter(m => m.has);
}
function pickCols(list, cfg) {
  let cols = cfg.map(c => ({ label: c[0], key: c[1].find(k => list.some(m => m.vals[k] !== undefined)) })).filter(c => c.key);
  if (cols.length < 2 && list.length) cols = Object.keys(list[0].vals).map(k => ({ label: k, key: k }));
  return cols;
}
function toRows(list, cols, ti) {
  return list.map(m => ({ id: m.a.id, name: m.a.displayName || m.a.shortName || '', short: m.a.shortName || m.a.displayName || '',
    pos: (m.a.position && m.a.position.abbreviation) || '', jersey: m.a.jersey || '', ti,
    vals: cols.map(c => m.vals[c.key] !== undefined ? m.vals[c.key] : '-') }));
}
function statsHTML(g) {
  const teams = (g.sum.boxscore && g.sum.boxscore.players) || [];
  if (!teams.length) return msg('Statistiky zatím nejsou k dispozici.');
  const idx = Math.min(g.team, teams.length - 1);
  const seg = `<div class="seg">${teams.map((t, i) =>
    `<button data-team="${i}" class="${i === idx ? 'on' : ''}">${esc((t.team && (t.team.shortDisplayName || t.team.displayName)) || 'Tým ' + (i+1))}</button>`).join('')}</div>`;
  const t = teams[idx];
  let out = '';
  if (g.league === 'nhl') {
    const all = mergedAthletes(t);
    const posOf = m => (m.a.position && m.a.position.abbreviation) || '';
    const sets = [['Forwards', all.filter(m => !['D', 'G'].includes(posOf(m))), NHL_SKATER],
                  ['D-Men', all.filter(m => posOf(m) === 'D'), NHL_SKATER],
                  ['Goalies', all.filter(m => posOf(m) === 'G'), NHL_GOALIE]];
    sets.forEach(s => { if (s[1].length) { const cols = pickCols(s[1], s[2]); out += tbl(s[0], cols.map(c => c.label), toRows(s[1], cols, idx)); } });
  } else if (g.league === 'nba') {
    const all = mergedAthletes(t);
    const sets = [['Starters', all.filter(m => m.starter)], ['Bench', all.filter(m => !m.starter)]];
    sets.forEach(s => { if (s[1].length) { const cols = pickCols(s[1], NBA_COLS); out += tbl(s[0], cols.map(c => c.label), toRows(s[1], cols, idx)); } });
  } else {
    (t.statistics || []).forEach(grp => {
      const labels = grp.labels || grp.names || [];
      const ath = (grp.athletes || []).filter(a => a.athlete && a.stats && a.stats.length);
      if (!ath.length) return;
      const rows = ath.map(a => ({ id: a.athlete.id, name: a.athlete.displayName || '', short: a.athlete.shortName || a.athlete.displayName || '',
        pos: (a.athlete.position && a.athlete.position.abbreviation) || '', jersey: a.athlete.jersey || '', ti: idx, vals: a.stats }));
      out += tbl(NFL_GROUPS[grp.name] || grp.text || grp.name || '', labels, rows);
    });
  }
  return seg + (out || msg('Statistiky zatím nejsou k dispozici.'));
}

/* ----- průběh zápasu ----- */
function getPlays(sum) {
  if (sum.plays && sum.plays.length) return sum.plays;
  if (sum.drives) {
    const d = [].concat(sum.drives.previous || [], sum.drives.current ? [sum.drives.current] : []);
    return d.flatMap(x => x.plays || []);
  }
  return [];
}
const ORD = ['1ST', '2ND', '3RD', '4TH'];
function periodLabel(league, n) {
  if (league === 'nhl') return n <= 3 ? ORD[n-1] + ' PERIOD' : (n === 4 ? 'OVERTIME' : 'SHOOTOUT');
  return n <= 4 ? ORD[n-1] + ' QUARTER' : 'OVERTIME' + (n > 5 ? ' ' + (n - 4) : '');
}
function playsHTML(g) {
  const plays = getPlays(g.sum);
  if (!plays.length) return msg('Záznam hry zatím není k dispozici.');
  const logos = {};
  ((g.sum.header && g.sum.header.competitions && g.sum.header.competitions[0] && g.sum.header.competitions[0].competitors) || [])
    .forEach(c => { if (c.team) logos[c.team.id] = c.team.logo || (c.team.logos && c.team.logos[0] && c.team.logos[0].href) || ''; });
  const groups = new Map();
  plays.forEach(p => { const n = (p.period && p.period.number) || 1; if (!groups.has(n)) groups.set(n, []); groups.get(n).push(p); });
  const live = g.ev && g.ev.state === 'in';
  const keys = [...groups.keys()].sort((a, b) => a - b);
  if (live) keys.reverse();
  return keys.map((k, i) => {
    let list = groups.get(k); if (live) list = [...list].reverse();
    const open = state.closed.has(k) ? false : (state.open.has(k) || i === 0);
    const rows = list.map(p => {
      const lg = p.team && logos[p.team.id];
      const sc = p.scoringPlay && p.awayScore != null ? `<span class="sco">${esc(p.awayScore)} – ${esc(p.homeScore)}</span>` : '';
      return `<div class="play ${p.scoringPlay ? 'scr' : ''}"><span class="pl">${lg ? `<img src="${esc(lg)}" alt="" onerror="this.style.visibility='hidden'">` : ''}</span>
        <span class="clk">${esc((p.clock && p.clock.displayValue) || '')}</span><span class="txt">${esc(p.text || p.shortText || '')}${sc}</span></div>`;
    }).join('');
    return `<details data-period="${k}" ${open ? 'open' : ''}><summary>${periodLabel(g.league, k)}</summary>${rows}</details>`;
  }).join('');
}

/* ----- stránka hráče ----- */
function renderPlayer() {
  const p = state.player;
  const body = !p.done ? msg('Načítám…') : p.tab === 'gl' ? gamelogHTML(p) : p.tab === 'season' ? seasonHTML(p) : careerHTML(p);
  const sub = [p.jersey ? '#' + p.jersey : '', p.pos, p.team].filter(Boolean).join(' · ');
  const tab = (k, l) => `<button data-ptab="${k}" class="${p.tab === k ? 'on' : ''}">${l}</button>`;
  $app.innerHTML = `
    <header class="d"><div class="tabs"><button class="back" data-back aria-label="Zpět">‹</button></div></header>
    <main><div class="phero"><img class="hs" src="https://a.espncdn.com/i/headshots/${p.league}/players/full/${esc(p.id)}.png" alt="" onerror="this.style.visibility='hidden'">
      <div><div class="pname">${esc(p.name)}</div><div class="psub">${esc(sub)}</div></div></div>
      <div class="dtabs sm">${tab('gl', 'Gamelog')}${tab('season', 'Season stats')}${tab('career', 'Career stats')}</div>
      <div class="pane t">${body}</div></main>`;
}
function simpleTable(title, labels, rows, totals) {
  const trs = rows.map(r => `<tr><td class="n"><span class="pn">${esc(r.n)}</span><small>${esc(r.sub || '')}</small></td>${r.vals.map(v => `<td>${nv(v)}</td>`).join('')}</tr>`).join('');
  const tot = totals ? `<tr><td class="n">Career</td>${totals.map(v => `<td><b>${esc(v)}</b></td>`).join('')}</tr>` : '';
  return `<section class="blk"><div class="tw"><table><thead><tr><th class="n">${esc(title)}</th>${labels.map(l => `<th>${esc(l)}</th>`).join('')}</tr></thead><tbody>${trs}${tot}</tbody></table></div></section>`;
}
function gamelogHTML(p) {
  if (p.glErr) return msg('Gamelog se nepodařilo načíst (' + p.glErr + ').');
  if (!p.gl) return msg('Gamelog není k dispozici.');
  const j = p.gl, labels = j.labels || j.names || [], meta = j.events || {};
  const seen = new Set(), rows = [];
  (j.seasonTypes || []).forEach(st => (st.categories || []).forEach(cat => (cat.events || []).forEach(e => {
    if (seen.has(e.eventId) || !e.stats) return;
    seen.add(e.eventId); rows.push({ m: meta[e.eventId] || {}, s: e.stats });
  })));
  if (!rows.length) return msg('Žádné odehrané zápasy.');
  rows.sort((a, b) => new Date(b.m.gameDate || 0) - new Date(a.m.gameDate || 0));
  let cols = (GL_COLS[p.league] || []).filter(l => !(l === 'S' && labels.includes('SOG'))).map(l => [l, labels.indexOf(l)]).filter(c => c[1] >= 0);
  if (cols.length < 3) cols = labels.map((l, i) => [l, i]);
  const trs = rows.slice(0, 10).map(r => {
    const m = r.m, opp = (m.opponent && (m.opponent.abbreviation || m.opponent.displayName)) || '';
    return `<tr><td class="n"><span class="pn">${m.gameDate ? esc(fmtShort(m.gameDate)) : ''}</span><small>${esc((m.atVs || '') + ' ' + opp)}</small></td>
      <td><span class="${m.gameResult === 'W' ? 'W' : m.gameResult === 'L' ? 'L' : ''}">${esc(m.gameResult || '')}</span> ${esc(m.score || '')}</td>${cols.map(c => `<td>${nv(r.s[c[1]])}</td>`).join('')}</tr>`;
  }).join('');
  return `<section class="blk" style="margin-top:6px"><div class="tw"><table><thead><tr><th class="n">Last 10</th><th></th>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${trs}</tbody></table></div></section>`;
}
function statCats(j) {
  return ((j && j.categories) || []).filter(c => c.statistics && c.statistics.length).map(c => ({
    title: c.displayName || c.name || '', labels: c.labels || c.names || [],
    rows: c.statistics.map(r => ({ n: (r.season && (r.season.displayName || r.season.year)) || '', sub: r.teamSlug || (r.team && r.team.abbreviation) || '', vals: r.stats || [] })),
    totals: c.totals && c.totals.length ? c.totals : null }));
}
function seasonHTML(p) {
  if (p.stErr) return msg('Statistiky se nepodařilo načíst (' + p.stErr + ').');
  const cats = statCats(p.st);
  if (!cats.length) return msg('Statistiky sezóny nejsou k dispozici.');
  return cats.map(c => simpleTable(c.title, c.labels, [c.rows[c.rows.length - 1]], null)).join('');
}
function careerHTML(p) {
  if (p.stErr) return msg('Statistiky se nepodařilo načíst (' + p.stErr + ').');
  const cats = statCats(p.st);
  if (!cats.length) return msg('Statistiky kariéry nejsou k dispozici.');
  return cats.map(c => simpleTable(c.title, c.labels, [...c.rows].reverse(), c.totals)).join('');
}

/* ---------- navigace ---------- */
function openGame(league, id) {
  state.league = league;
  state.game = { league, id, sum: null, ev: null, tab: 'stats', team: 0, err: null };
  state.open.clear(); state.closed.clear();
  window.scrollTo(0, 0);
  render(); loadGame();
}
function closeGame() { state.game = null; state.player = null; render(); loadList(true); }
function route() {
  const pm = location.hash.match(/^#\/player\/(\w+)\/(\d+)/);
  const gm = location.hash.match(/^#\/game\/(\w+)\/(\d+)/);
  if (pm && state.pmeta && state.pmeta.id === pm[2] && state.game) {
    if (!state.player) window.scrollTo(0, 0);
    state.player = state.pmeta; render();
    if (!state.pmeta.loaded) loadPlayer();
    return;
  }
  state.player = null;
  if (gm && LEAGUES[gm[1]]) {
    if (state.game && state.game.id === gm[2]) render(); else openGame(gm[1], gm[2]);
  } else closeGame();
}
window.addEventListener('hashchange', route);

const $app = document.getElementById('app');
$app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-league],[data-game],[data-date],[data-tab],[data-ptab],[data-team],[data-player],[data-refresh],[data-back]');
  if (!b) return;
  const d = b.dataset;
  if (d.league) {
    state.league = d.league; store.set('league', d.league);
    setDate(todayET()); loadList();
  } else if (d.player) {
    const g = state.game, t = (g.sum.boxscore.players[+d.ti] || {}).team || {};
    state.pmeta = { league: g.league, id: d.player, name: d.pn, pos: d.pp, jersey: d.pj, team: t.displayName || '', tab: 'gl', loaded: false, done: false };
    window._fromList = true;
    location.hash = '#/player/' + g.league + '/' + d.player;
  } else if (d.game !== undefined) {
    window._fromList = true;
    location.hash = '#/game/' + state.league + '/' + d.game;
  } else if (d.date) {
    setDate(new Date(+d.date.slice(0, 4), +d.date.slice(4, 6) - 1, +d.date.slice(6, 8), 12));
    loadList();
  } else if (d.tab) {
    state.game.tab = d.tab; window.scrollTo(0, 0); render();
  } else if (d.ptab) {
    state.player.tab = d.ptab; render();
  } else if (d.team !== undefined) {
    state.game.team = parseInt(d.team); render();
  } else if (d.refresh !== undefined) {
    if (state.player) { state.player.done = false; render(); loadPlayer(); }
    else if (state.game) loadGame(); else loadList();
  } else if (d.back !== undefined) {
    if (window._fromList) history.back();
    else location.hash = state.player && state.game ? '#/game/' + state.game.league + '/' + state.game.id : '';
  }
});
$app.addEventListener('toggle', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.period) return;
  const k = parseInt(el.dataset.period);
  if (el.open) { state.open.add(k); state.closed.delete(k); } else { state.closed.add(k); state.open.delete(k); }
}, true);

setInterval(() => {
  if (document.hidden || state.player) return;
  if (state.game) { if (state.game.ev && state.game.ev.state === 'in') loadGame(); }
  else if (state.events.some(e => e.state === 'in')) loadList(true);
}, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden || state.player) return;
  state.game ? loadGame() : loadList(true);
});

if (/^#\/game\//.test(location.hash)) route(); else loadList();
</script>
</body>
</html>
