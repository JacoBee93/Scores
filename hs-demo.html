<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Headshot demo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#fff;font-family:'Barlow Condensed',-apple-system,sans-serif;padding:calc(env(safe-area-inset-top) + 20px) 16px 40px}
h2{font-size:14px;color:#8e8e93;letter-spacing:.5px;text-transform:uppercase;margin:22px 0 8px}
.card{background:#1c1c1e;border-radius:18px;padding:12px 16px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.r{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.r img{width:38px;height:38px;flex:none}
.A img{border-radius:50%;object-fit:cover;background:#2c2c2e}
.B img{object-fit:contain;object-position:bottom}
.C img{border-radius:10px;object-fit:cover;background:#2c2c2e}
.D img{width:46px;height:46px;object-fit:contain;object-position:bottom;margin:-4px 0}
.E img{object-fit:cover;object-position:top;background:#2c2c2e;border-radius:8px}
#msg{color:#8e8e93}
</style></head><body>
<div id="msg">Načítám jezdce z ESPN…</div><div id="out"></div>
<script>
const V = [['A','Teď – kulička, šedé pozadí'],['B','Bez kuličky, bez pozadí (výřez)'],['C','Šedý čtverec se zaoblením'],['D','Bez pozadí, o kousek větší'],['E','Šedý čtverec, ořez od hlavy']];
fetch('https://site.api.espn.com/apis/v2/sports/racing/f1/standings?season=2026').then(r=>r.json()).then(j=>{
  const ch=j.children||[]; const st=((ch.find(c=>/driver/i.test(c.name))||ch[0]||{}).standings||{}).entries||[];
  const d=st.slice(0,3).map(e=>e.athlete||{}).filter(a=>a.id);
  if(!d.length){document.getElementById('msg').textContent='Nepodařilo se načíst jezdce.';return;}
  document.getElementById('msg').remove();
  document.getElementById('out').innerHTML=V.map(([k,t])=>`<h2>${k} · ${t}</h2><div class="card ${k}">${d.map(a=>`<div class="r"><img src="https://a.espncdn.com/i/headshots/rpm/players/full/${a.id}.png" alt=""><span>${a.displayName||''}</span></div>`).join('')}</div>`).join('');
}).catch(()=>{document.getElementById('msg').textContent='Chyba při načítání z ESPN.';});
</script></body></html>
